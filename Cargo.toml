[package]
name = "symphony"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
# Compile the MS Teams chat-connector skeleton (src/swebot/chat/teams.rs) -- a
# compile-checked template for the ChatConnector trait, not a working connector yet.
# Opting a connector in is: implement the real HTTP/Graph plumbing in that module,
# add "teams" to config::KNOWN_CHAT_CONNECTORS, and construct it in chat::start.
teams = []

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
futures = "0.3.33"
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
quick-xml = "0.41"
rand = "0.10.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync", "io-util", "signal", "io-std", "net"] }
tokio-stream = { version = "0.1.17", default-features = false, features = ["sync"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6.5"
